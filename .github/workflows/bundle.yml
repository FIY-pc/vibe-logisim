name: bundle

# Builds Linux and Windows bundles on their native OS from pinned archives,
# then smoke-tests each bundle on its real OS (open folder, build an AND gate,
# native truth table via bundled Java+Logisim, built-in AI setup and restart).
# Standard smoke checks use local fixtures. Real model checks require an
# explicit workflow dispatch with run_ai enabled and VIBE_TEST_* secrets.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      run_ai:
        description: Run two paid model turns with configured test credentials
        type: boolean
        default: false

permissions:
  contents: write

env:
  COURSE_RUNTIME_SHA256: b2400702fb9e8e4c71c512d7e09678a788039f402be55164209cde4cee8fc996

jobs:
  # Fast feedback on the host code paths the Windows port touched (path
  # handling, folder workspace, provider config, capability report). Runs
  # before either distribution artifact is built.
  unit-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install runtime dependencies
        run: npm --prefix apps/desktop ci --ignore-scripts
      - name: Node unit tests (Windows)
        shell: pwsh
        run: |
          node --test `
            apps/desktop/electron/folder-workspace.test.cjs `
            apps/desktop/electron/folder-import.test.cjs `
            apps/desktop/electron/folder-operations.test.cjs `
            apps/desktop/electron/codex-capabilities.test.cjs `
            apps/desktop/electron/provider-config.test.cjs `
            apps/desktop/electron/agent-workspace.test.cjs `
            apps/desktop/electron/direct-agent-workspace-errors.test.cjs `
            apps/desktop/electron/conversations.test.cjs `
            apps/desktop/electron/builtin-backend.test.cjs `
            apps/desktop/electron/runtime-installer.test.cjs `
            apps/desktop/electron/startup-target.test.cjs `
            apps/desktop/electron/model-tool-output.test.cjs `
            apps/desktop/electron/custom-provider.test.cjs `
            apps/desktop/electron/provider-probe.test.cjs `
            apps/desktop/electron/system-proxy.test.cjs `
            apps/desktop/electron/agent-tool-host.test.cjs `
            apps/desktop/electron/diagnostics-log.test.cjs `
            apps/desktop/electron/diagnostics-bundle.test.cjs `
            apps/desktop/electron/work-notes.test.cjs `
            apps/desktop/electron/submit-receipt.test.cjs `
            apps/desktop/test/signal-trace.cjs `
            apps/desktop/test/organized-layout.cjs `
            apps/desktop/electron/update-check.test.cjs
      - name: Verify bundled SDK protocols without node_modules
        run: node scripts/distribution/test-sdk.cjs
      - name: Python server control-channel probe (Windows, host Python)
        shell: pwsh
        run: python apps/desktop/test/server-control-probe.py

  build:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
          - target: win32-x64
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install desktop dependencies (runtime SDK and browser assets)
        run: npm --prefix apps/desktop ci
      - name: Fetch course runtime (build input kept out of git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p workspaces/hust-riscv/original/course-package
          gh release download build-inputs --repo "$GITHUB_REPOSITORY" --pattern 'logisim-ita-cn-20200118.exe' --dir workspaces/hust-riscv/original/course-package
          echo "$COURSE_RUNTIME_SHA256  workspaces/hust-riscv/original/course-package/logisim-ita-cn-20200118.exe" | sha256sum -c -
      - name: Cache pinned runtime archives
        uses: actions/cache@v4
        with:
          path: ~/.cache/vibe-distribution
          key: runtimes-${{ matrix.target }}-${{ hashFiles('scripts/distribution/runtime-lock.json') }}
      - name: Build bundle
        run: |
          python3 scripts/distribution/build.py \
            --target ${{ matrix.target }} \
            --output dist \
            --cache ~/.cache/vibe-distribution \
            --course-runtime workspaces/hust-riscv/original/course-package/logisim-ita-cn-20200118.exe
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.target }}
          path: |
            dist/*-setup.exe
            dist/*.tar.xz
            dist/*.tar.gz
            dist/*.sha256
            dist/*.size.json
            dist/logisim-2.16.2.2-source.tar.gz
          compression-level: 0
          retention-days: 7

  smoke-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: bundle-win32-x64
          path: bundle
      - name: Install bundle without administrator privileges
        shell: pwsh
        run: |
          $installer = (Get-ChildItem bundle/*-setup.exe | Select-Object -First 1).FullName
          $target = Join-Path $PWD 'unpacked/app'
          $process = Start-Process -FilePath $installer -ArgumentList '/S',"/D=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          if (-not (Test-Path "$target/vibe-logisim.exe")) { throw 'Installed executable missing' }
          Get-ChildItem unpacked
      - name: Install Playwright driver (test harness only; the bundle is self-contained)
        run: npm --prefix apps/desktop ci --ignore-scripts
      - name: Probe the bundled Python service directly (no Electron)
        shell: pwsh
        run: |
          $root = (Get-ChildItem unpacked -Directory | Select-Object -First 1).FullName
          $py = Join-Path $root 'resources\runtime\python\python.exe'
          $env:VIBE_PROBE_SERVER = Join-Path $root 'resources\product\apps\desktop\circuit-lens\server.py'
          $env:PATH = (Join-Path $root 'resources\runtime\java\bin') + ';' + $env:PATH
          & $py apps/desktop/test/server-control-probe.py
          $env:VIBE_PROBE_PYTHON = $py
          & $py apps/desktop/test/server-sibling-kill-probe.py
      - name: Smoke test the packaged app
        shell: pwsh
        run: |
          $exe = (Get-ChildItem unpacked -Recurse -Filter vibe-logisim.exe | Select-Object -First 1).FullName
          Write-Host "Executable: $exe"
          $env:VIBE_SMOKE_ROOT = "$env:RUNNER_TEMP"
          node apps/desktop/test/e2e-smoke-packaged.cjs "$exe" smoke-out
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node apps/desktop/test/e2e-runtime-packaged.cjs "$exe" smoke-out/runtime
      - name: Verify reinstall and uninstall preserve application data
        shell: pwsh
        run: |
          $target = Join-Path $PWD 'unpacked/app'
          $data = Join-Path $env:APPDATA 'vibe-logisim'
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content (Join-Path $data 'installer-retention.txt') 'preserve'
          $shortcut = Join-Path $env:APPDATA 'Microsoft/Windows/Start Menu/Programs/Vibe Logisim.lnk'
          if (-not (Test-Path $shortcut)) { throw 'Start menu shortcut missing' }
          $installer = (Get-ChildItem bundle/*-setup.exe | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $installer -ArgumentList '/S',"/D=$target" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Reinstall failed' }
          $uninstaller = (Get-ChildItem $target -Filter '*Uninstall*.exe' | Select-Object -First 1).FullName
          $p = Start-Process -FilePath $uninstaller -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Uninstall failed' }
          $limit = (Get-Date).AddSeconds(30)
          while ((Test-Path "$target/vibe-logisim.exe") -and (Get-Date) -lt $limit) { Start-Sleep -Seconds 1 }
          if (Test-Path "$target/vibe-logisim.exe") { throw 'Uninstall left the executable behind' }
          if ((Get-Content (Join-Path $data 'installer-retention.txt')) -ne 'preserve') { throw 'Uninstall removed application data' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-windows
          path: smoke-out
          if-no-files-found: ignore

  # Real model turns through the in-app "own API endpoint" form on the
  # packaged Windows app. Needs repository secrets; skipped when absent
  # (forks, PRs). Costs API quota; enable explicitly with workflow_dispatch.
  smoke-ai-windows:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.run_ai
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VIBE_TEST_BASE_URL: ${{ secrets.VIBE_TEST_BASE_URL }}
      VIBE_TEST_API_KEY: ${{ secrets.VIBE_TEST_API_KEY }}
      VIBE_TEST_MODEL: ${{ secrets.VIBE_TEST_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: bundle-win32-x64
          path: bundle
      - name: Install bundle without administrator privileges
        shell: pwsh
        run: |
          $installer = (Get-ChildItem bundle/*-setup.exe | Select-Object -First 1).FullName
          $target = Join-Path $PWD 'unpacked/app'
          $process = Start-Process -FilePath $installer -ArgumentList '/S',"/D=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          if (-not (Test-Path "$target/vibe-logisim.exe")) { throw 'Installed executable missing' }
      - name: Install Playwright driver
        run: npm --prefix apps/desktop ci --ignore-scripts
      - name: AI smoke (two real model turns)
        shell: pwsh
        run: |
          if (-not $env:VIBE_TEST_API_KEY) { Write-Host "No VIBE_TEST_* secrets; skipping AI smoke."; exit 0 }
          $exe = (Get-ChildItem unpacked -Recurse -Filter vibe-logisim.exe | Select-Object -First 1).FullName
          $env:VIBE_SMOKE_ROOT = "$env:RUNNER_TEMP"
          node apps/desktop/test/e2e-smoke-ai-packaged.cjs "$exe" smoke-ai-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-ai-windows
          path: smoke-ai-out
          if-no-files-found: ignore

  smoke-linux:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: bundle-linux-x64
          path: bundle
      - name: Unpack bundle
        run: |
          mkdir unpacked && tar xJf bundle/vibe-logisim-*-linux-x64.tar.xz -C unpacked
          ls unpacked
      - name: Install Playwright driver (test harness only)
        run: npm --prefix apps/desktop ci --ignore-scripts
      - name: Smoke test the packaged app under Xvfb
        run: |
          sudo apt-get install -y -qq xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1 >/dev/null
          exe=$(find unpacked -maxdepth 2 -name vibe-logisim -type f | head -1)
          echo "Executable: $exe"
          VIBE_SMOKE_NO_SANDBOX=1 xvfb-run -a node apps/desktop/test/e2e-smoke-packaged.cjs "$exe" smoke-out
          VIBE_SMOKE_NO_SANDBOX=1 xvfb-run -a node apps/desktop/test/e2e-runtime-packaged.cjs "$exe" smoke-out/runtime
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-linux
          path: smoke-out
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [unit-windows, build, smoke-windows, smoke-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          merge-multiple: true
          path: dist
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release upload "${GITHUB_REF_NAME}" dist/* --repo "$GITHUB_REPOSITORY"

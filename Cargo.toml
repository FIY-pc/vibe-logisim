[workspace]
members = ["crates/circuit-document", "crates/logisim-runtime", "crates/workbench-host", "apps/workbench/src-tauri"]
default-members = ["crates/circuit-document", "crates/logisim-runtime", "crates/workbench-host"]
resolver = "2"

[workspace.package]
version = "0.6.0-beta.2"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
sha2 = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
xmltree = "0.11"
quick-xml = "0.42"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"

ts-rs = { version = "12.0.1", features = ["serde-json-impl"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# Development builds stay quick to rebuild and to edit a course-size file in:
# dependencies (JSON, XML, digests, base64) are fully optimized, and the document
# crate, which applies edits and routes wires, lightly. Unoptimized, editing is
# four to six times slower.
[profile.dev.package."*"]
opt-level = 3

[profile.dev.package.vibe-circuit-document]
opt-level = 1

name: Native workbench checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install pinned toolchain and dependencies
        run: |
          rustup show
          npm ci
          npm run setup
      - name: Check document and generated contracts
        run: |
          cargo fmt --all --check
          cargo clippy -p vibe-workspace-core -p vibe-logisim-adapter -p vibe-workbench-host --all-targets -- -D warnings
          npm run check:contracts
          npm run test:core
          npm run check
          npm run test:runtime
          npm run test:ui
          npm run build
      - name: Verify native simulation, editing and local model transport
        run: |
          npm run test:native
          npm run test:files
          npm run test:compatibility
      - name: Verify bundled sidecar without workspace modules
        run: |
          npm run bundle:agent
          VIBE_LOGISIM_AGENT_ROOT="$PWD/.workbench-cache/agent-product" node scripts/workbench/verify.mts

  desktop-package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux-x64
          - os: windows-2025
            target: win32-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - name: Install toolchain and project dependencies
        run: |
          rustup show
          npm ci
      - name: Build desktop packages and verify relocated resources
        run: |
          npm run package:desktop
          npm run test:product
      - name: Launch Linux portable desktop and verify restart recovery
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Launch Windows portable desktop and verify restart recovery
        if: runner.os == 'Windows'
        run: npm run test:desktop
      - name: Build Windows installer upgrade baseline
        if: runner.os == 'Windows'
        run: node scripts/workbench/package.mts --upgrade-baseline
      - name: Verify Windows installation, upgrade and uninstall
        if: runner.os == 'Windows'
        run: npm run test:windows-install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-checks-${{ matrix.target }}
          path: .workbench-cache/checks/*.json
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: workbench-${{ matrix.target }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/nsis/*.exe
            .workbench-cache/Vibe-Logisim-${{ matrix.target }}.tar.gz
            .workbench-cache/Vibe-Logisim-${{ matrix.target }}.zip
          include-hidden-files: true
          if-no-files-found: error

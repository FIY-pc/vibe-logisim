name: Workbench

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      full_desktop:
        description: "Run all desktop platforms and Windows installation/upgrade checks"
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test scripts/workbench/ci-scope.test.mts
      - id: scope
        run: node scripts/workbench/ci-scope.mts

  windows-regression:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - run: npm ci
      - run: npm run test:runtime
      - run: cargo test -p vibe-circuit-document
      - name: Verify Windows state persistence under long Unicode paths
        run: cargo test -p vibe-workbench-host state_paths -- --nocapture
      - run: npm run check
      - run: npm run test:arranger
      - run: npm run test:classroom
      - run: npm run test:showcase
      - run: npm run test:ui

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Validate release version and notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/workbench/version.mts --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - name: Install project dependencies
        run: |
          npm ci
          npm run setup
      - name: Enable user namespaces for Linux sandbox tests
        run: |
          # The ephemeral Ubuntu runner restricts unprivileged user namespaces
          # by default. The command sandbox needs them for its private mounts.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          systemd-run --user --wait --pipe --property=PrivateUsers=yes --property=PrivateTmp=yes /usr/bin/true
      - name: Check document and generated contracts
        run: |
          cargo fmt --all --check
          cargo clippy -p vibe-circuit-document -p vibe-logisim-runtime -p vibe-workbench-host --all-targets
          npm run check:contracts
          npm run test:core
          npm run check
          npm run test:arranger
          npm run test:runtime
          npm run test:classroom
          npm run test:showcase
          npm run test:ui
          npm run build
      - name: Verify classroom grading with the real Logisim runtime
        run: |
          node packages/classroom/scripts/build-grader.mts
          CLASSROOM_TEST_GRADER_CP="$PWD/.workbench-cache/assessment/grader-bridge.jar:$PWD/.workbench-cache/Logisim-ITA.jar" node --test packages/classroom/test/native-grader.test.mts
      - name: Verify native simulation, editing and local model transport
        run: |
          npm run test:native
          npm run test:interfaces
          npm run test:history
          npm run test:files
          npm run test:compatibility
      - name: Verify bundled sidecar without workspace modules
        run: |
          npm run bundle:agent
          VIBE_LOGISIM_AGENT_ROOT="$PWD/.workbench-cache/agent-product" node scripts/workbench/verify.mts
      - name: Show sandbox startup diagnostics
        if: failure()
        run: |
          journalctl --user --no-pager --since '-20 minutes' --unit='vibe-builtin-*'
          sudo journalctl -k --no-pager --since '-20 minutes' --grep='apparmor|DENIED'

  desktop-package:
    needs: scope
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb
      - run: rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
      - run: npm ci
      - name: Verify macOS runtime and frontend contracts
        if: runner.os == 'macOS'
        run: |
          npm run check
          node scripts/workbench/network-check.mts
          node scripts/workbench/macos-command-check.mts
          cargo test -p vibe-circuit-document -p vibe-workbench-host
      - name: Build desktop packages and verify relocated resources
        run: |
          npm run package:desktop
          npm run test:product
      - name: Launch Linux portable desktop and verify restart recovery
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:desktop
      - name: Launch Windows portable desktop and verify restart recovery
        if: runner.os == 'Windows'
        run: npm run test:desktop
      - name: Launch macOS application and verify restart recovery
        if: runner.os == 'macOS'
        run: |
          npm run test:desktop
          npm run test:desktop -- --dmg
      - name: Verify Windows portable extraction path budget
        if: runner.os == 'Windows'
        run: node scripts/workbench/verify-portable-paths.mts
      - name: Build Windows installer upgrade baseline
        if: runner.os == 'Windows'
        run: node scripts/workbench/package.mts --upgrade-baseline
      - name: Verify Windows installation, upgrade and uninstall
        if: runner.os == 'Windows'
        run: npm run test:windows-install
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-checks-${{ matrix.target }}
          path: .workbench-cache/checks/*.json
          include-hidden-files: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-${{ matrix.target }}
          path: .workbench-cache/release/*
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [integration, windows-regression, desktop-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: workbench-*
          merge-multiple: true
          path: dist
      - name: Verify release assets
        working-directory: dist
        run: |
          sha256sum --check --strict SHA256SUMS-linux-x64.txt
          sha256sum --check --strict SHA256SUMS-win32-x64.txt
          sha256sum --check --strict SHA256SUMS-darwin-arm64.txt
          sha256sum --check --strict SHA256SUMS-darwin-x64.txt
          cat SHA256SUMS-*.txt | sort -k2 > SHA256SUMS
          version="${GITHUB_REF_NAME#v}"
          expected=(
            "vibe-logisim-$version-linux-x64.deb"
            "vibe-logisim-$version-linux-x64.tar.gz"
            "vibe-logisim-$version-win32-x64-setup.exe"
            "vibe-logisim-$version-win32-x64.zip"
            "vibe-logisim-$version-darwin-arm64.dmg"
            "vibe-logisim-$version-darwin-arm64.zip"
            "vibe-logisim-$version-darwin-x64.dmg"
            "vibe-logisim-$version-darwin-x64.zip"
          )
          diff -u <(printf '%s\n' "${expected[@]}" | sort) <(awk '{print $2}' SHA256SUMS | sort)
          rm SHA256SUMS-*.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" "${prerelease[@]}"
          fi
